services:
  vllm_gemma4:
    platform: linux/amd64
    image: vllm/vllm-openai:v0.25.1
    container_name: vllm_gemma
    ports:
      - ${LLM_API_PORT}:8000
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LD_LIBRARY_PATH=/lib/x86_64-linux-gnu
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    ipc: host
    volumes:
      - ${HUGGING_FACE_CACHE_DIR}:/root/.cache/huggingface
    command: >
        --port 8000
        --model RedHatAI/gemma-4-31B-it-NVFP4
        --served-model-name Gemma/Gemma-4-31B
        --max-model-len auto
        --max-num-batched-tokens 4096
        --gpu-memory-utilization 0.95
        --enable-auto-tool-choice
        --tool-call-parser gemma4
        --chat-template examples/tool_chat_template_gemma4.jinja
        --async-scheduling
        --tensor-parallel-size 1
        --max-num-seqs 1
        --reasoning-parser gemma4
        --enforce-eager
        --limit-mm-per-prompt '{"image": 0, "video": 0}'
        --disable_chunked_mm_input
        --cpu-offload-gb 10


  faster_whisper:
    build:
      context: https://github.com/DCC-BS/bentoml-faster-whisper.git
      dockerfile: ./Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    ports:
      - "50001:50001"
    environment:
      - http_proxy
      - HTTP_PROXY
      - https_proxy
      - HTTPS_PROXY
      - no_proxy
      - NO_PROXY
      - TIMEOUT
      - MAX_CONCURRENCY
      - MAX_BATCH_SIZE
      - MAX_LATENCY_MS
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - hugging_face_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          memory: 16g
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
  docling-serve-translator:
    image: quay.io/docling-project/docling-serve-cu124:latest
    container_name: docling-serve-translator
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    ports:
      - "8004:5001"
    environment:
      - DOCLING_MODELS_PATH=/models
      - DOCLING_CONFIG_FILE=/app/docling_config.json
      - DOCLING_SERVE_ENABLE_UI=true
    volumes:
      - "${HOME}/.cache/docling:/models"
      - ./docling_config.json:/app/docling_config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
