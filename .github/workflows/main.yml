name: Main

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"

permissions:
    contents: read

jobs:
    backend-ci:
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@6b2f0bb53bac8ccb9847ba77f68f62488b668f6d # v10.0.3
        permissions:
            contents: read
            pull-requests: write
        with:
            check-command: "mise run ci-check"
