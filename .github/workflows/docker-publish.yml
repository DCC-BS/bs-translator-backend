name: Build and Publish Docker Image
on:
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish:
        uses: DCC-BS/ci-workflows/.github/workflows/publish-docker.yml@6b2f0bb53bac8ccb9847ba77f68f62488b668f6d # v10.0.3
        secrets: inherit
        with:
            project_type: "python" # or "node"
            registry: ghcr.io
            image_name: ghcr.io/${{ github.repository }}
            context: .
            dockerfile: ./Dockerfile
            platforms: linux/amd64
            push: true
            inject_github_token: true
